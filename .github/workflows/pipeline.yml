name: pipeline

on:
  push:
    paths: ["pipeline/**", "data/**", "models/**", "pyproject.toml", ".github/workflows/pipeline.yml"]
  pull_request:
    paths: ["pipeline/**", "data/**", "models/**", "pyproject.toml", ".github/workflows/pipeline.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: ruff check pipeline
      - run: ruff format --check pipeline
      - run: pytest
