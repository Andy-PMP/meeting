name: Deploy to GitHub Pages

# Same shape as Neighborly's deploy workflow, plus the Playwright privacy/accessibility tests as
# a gate: nothing deploys unless the built site makes no cross-origin requests. npm workspaces:
# install and build from the repo root; the static site lands in web/dist. The custom domain is
# set in the repo's Pages settings (a CNAME file is ignored for Actions-based deploys).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx -w web playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
