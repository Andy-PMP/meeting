name: web

on:
  push:
    paths: ["web/**", "data/**", "models/**", "docs/**", "package.json", "package-lock.json", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "data/**", "models/**", "docs/**", "package.json", "package-lock.json", ".github/workflows/web.yml"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx -w web playwright install --with-deps chromium
      - run: npm run e2e
