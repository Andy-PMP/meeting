[project]
name = "meeting-pipeline"
version = "0.1.0"
description = "Offline data, training and export pipeline for Could This Meeting Be an Email?"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
src = ["pipeline"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
pythonpath = ["pipeline"]
